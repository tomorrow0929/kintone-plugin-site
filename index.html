<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      // 旧URL（amplifyapp.com）で開かれたら、新しいドメインへ移します。
      // Amplifyコンソール側の301リダイレクトが本命で、これはその保険です。
      (function () {
        if (location.hostname.indexOf('.amplifyapp.com') !== -1) {
          location.replace(
            'https://plugins.to-morrow.net' + location.pathname + location.search + location.hash
          )
        }
      })()
    </script>

    <!--
      検索結果に出るアイコン（ファビコン）。
      Google は「48pxの倍数の正方形」を求めるため、48x48 を含む .ico と
      192x192 の PNG を申告している。
      sizes は実際に入っているサイズを正しく書くこと。
      favicon.ico の中身は 16x16 / 32x32 / 48x48 の3つ。
      以前ここを sizes="32x32" と書いていて、48px の候補が無いように見えていた。

      ※ Google はサイトの「トップページ」の申告を見て、そのサイト全体の
        アイコンを決める。個別ページに書いても意味がない。
        反映はトップページが再クロールされたときで、数日〜数週間かかる。
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-192x192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#01545a" />

    <!--
      ここに書いたタイトル・説明文・canonical は「最初に読み込まれる既定値」です。
      各ページでは src/lib/meta.js が中身を差し替えます。
      36本すべてが同じタイトル・同じ canonical のままだと、
      検索エンジンから見て区別がつかず、個別のプラグイン名で拾われません。
    -->
    <title>kintone 無料プラグイン一覧 | to.Morrow</title>
    <meta
      name="description"
      content="帳票出力・Excel出力・ガントチャート・一括更新など、業務で使える kintone プラグインをすべて無料で配布しています。会員登録不要、利用期限・出力枚数の制限もありません。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://plugins.to-morrow.net/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="to.Morrow kintone プラグイン" />
    <meta property="og:title" content="kintone 無料プラグイン一覧 | to.Morrow" />
    <meta
      property="og:description"
      content="業務で使える kintone プラグインを、すべて無料・会員登録不要で配布しています。"
    />
    <meta property="og:url" content="https://plugins.to-morrow.net/" />
    <meta property="og:image" content="https://plugins.to-morrow.net/apple-touch-icon.png" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary" />

    <!-- 事業サイトとの関係を検索エンジンに伝える -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "to.Morrow kintone プラグイン",
        "url": "https://plugins.to-morrow.net/",
        "inLanguage": "ja",
        "publisher": {
          "@type": "Organization",
          "name": "to.Morrow",
          "url": "https://to-morrow.net/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
