# AWS Amplify のビルド設定（Amplify Gen 2 / バックエンド付き）
#
# backend フェーズで amplify/ フォルダの定義（DB・ログイン・S3）をデプロイし、
# その接続情報を書いた amplify_outputs.json を生成します。
# frontend フェーズでその情報を使ってサイトをビルドします。
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
